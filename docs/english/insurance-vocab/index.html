const $=id=>document.getElementById(id);
const K='insVocabScores';let S=JSON.parse(localStorage.getItem(K)||'{"type":[0,0],"quiz":[0,0],"wrong":{}}');
const save=()=>localStorage.setItem(K,JSON.stringify(S));
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,''));u.lang='en-US';u.rate=0.7;speechSynthesis.speak(u)}catch(e){}}
const CX=[[/\blet's\b/g,'let us'],[/\bwon't\b/g,'will not'],[/\bcan't\b/g,'cannot'],[/\bcan not\b/g,'cannot'],[/\bshan't\b/g,'shall not'],[/n't\b/g,' not'],[/'re\b/g,' are'],[/'m\b/g,' am'],[/'ll\b/g,' will'],[/'ve\b/g,' have'],[/'d\b/g,' would'],[/\b(it|that|what|there|here|who|he|she|where|how)'s\b/g,'$1 is']];
const norm=s=>{s=s.toLowerCase().replace(/[’‘`]/g,"'").replace(/…/g,' ');CX.forEach(([a,b])=>s=s.replace(a,b));return s.replace(/[-_/]/g,' ').replace(/[^a-z0-9& ']/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim()};
function accepts(w){const a=[w];const m=w.match(/^(.*?)\s*\((.*)\)$/);if(m){a.push(m[1],m[2])}w.split('/').forEach(x=>a.push(x));return a.map(norm)}
const secs=[...new Set(D.map(d=>d.s))];
$('secSel').innerHTML='<option value="">All sections 全部 ('+D.length+')</option>'+secs.map(s=>`<option>${s}</option>`).join('');
const pool=()=>{const v=$('secSel').value;return v?D.filter(d=>d.s==v):D};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const modes=[['type','✍️ Type 拼写 (main)'],['quiz','✅ Quiz 选择'],['flash','🃏 Cards 卡片'],['list','📖 List 词表'],['stats','📊 Score 成绩']];
$('nav').innerHTML=modes.map(m=>`<button data-m="${m[0]}">${m[1]}</button>`).join('');
function show(m){modes.forEach(x=>$(x[0]).classList.toggle('hide',x[0]!=m));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));if(m=='list')renderList();if(m=='stats')renderStats();if(m=='flash')renderFlash()}
$('nav').onclick=e=>{if(e.target.dataset.m)show(e.target.dataset.m)};
// Type mode
let cur,answered,hintLv;
function nextType(){cur=rnd(pool());answered=false;hintLv=0;$('tSec').textContent=cur.s;$('tZh').textContent=cur.zh;$('tIn').value='';$('tHint').textContent='';$('tRes').innerHTML='';$('tListen').classList.add('hide');$('tIn').focus();tStat()}
function tStat(){const[a,b]=S.type;$('tStat').textContent=`Correct ${a} / ${b}`+(b?` (${Math.round(a*100/b)}%)`:'')}
function check(){if(answered){nextType();return}const v=norm($('tIn').value);if(!v)return;answered=true;const ok=accepts(cur.w).includes(v);S.type[1]++;if(ok){S.type[0]++;delete S.wrong[cur.w]}else S.wrong[cur.w]=(S.wrong[cur.w]||0)+1;save();
$('tRes').innerHTML=(ok?'<div class="ok">✔ Correct! 正确</div>':'<div class="bad">✘ Not quite 不对</div>')+`<div class="en">${cur.w}</div>${cur.ipa?`<div class="ipa">${cur.ipa}</div>`:''}`;$('tListen').classList.remove('hide');tStat();say(cur.w)}
$('tCheck').onclick=check;$('tNext').onclick=nextType;$('tListen').onclick=()=>say(cur.w);
$('tIn').onkeydown=e=>{if(e.key=='Enter')check()};
$('tHintB').onclick=()=>{hintLv++;const w=cur.w.replace(/\s*\(.*\)$/,'');const n=w.replace(/[^A-Za-z]/g,'').length;
$('tHint').textContent=hintLv==1?`Starts with "${w[0]}", ${n} letters`:w.split(/(\s|-)/).map(p=>/\s|-/.test(p)?p:p.slice(0,Math.min(hintLv-1,p.length))+'_'.repeat(Math.max(0,p.length-hintLv+1))).join('')};
// Quiz
let qDir=1,qCur,qDone;
function nextQuiz(){const p=pool();qCur=rnd(p);qDone=false;const opts=[qCur];while(opts.length<4&&opts.length<D.length){const o=rnd(p.length>=4?p:D);if(!opts.includes(o))opts.push(o)}opts.sort(()=>Math.random()-.5);
$('qDir').textContent=qDir?'Mode: 中文 → English':'Mode: English → 中文';$('qQ').textContent=qDir?qCur.zh:qCur.w;$('qRes').innerHTML='';
$('qOpts').innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=qDir?o.w:o.zh;b.onclick=()=>{if(qDone)return;qDone=true;const ok=o===qCur;S.quiz[1]++;if(ok)S.quiz[0]++;save();b.classList.add(ok?'r':'w');[...$('qOpts').children].forEach((c,i)=>{if(opts[i]===qCur)c.classList.add('r')});$('qRes').innerHTML=`<div class="${ok?'ok':'bad'}">${ok?'✔ Correct':'✘ Wrong'}</div><span class="en">${qCur.w}</span> <span class="ipa">${qCur.ipa}</span> ${qCur.zh}`;say(qCur.w);qStat()};$('qOpts').appendChild(b)});qStat()}
function qStat(){const[a,b]=S.quiz;$('qStat').textContent=`Correct ${a} / ${b}`}
$('qDir').onclick=()=>{qDir^=1;nextQuiz()};$('qNext').onclick=nextQuiz;$('qListen').onclick=()=>say(qCur.w);
// Flash
let fi=0,fBack=false;
function renderFlash(){const p=pool();fi=(fi+p.length)%p.length;const d=p[fi];$('fc').innerHTML=fBack?`<div class="en">${d.w}</div><div class="ipa">${d.ipa}</div><div>${d.zh}</div>`:`<div class="zh">${d.zh}</div><div class="sec">tap to flip 点击翻面</div>`;$('fStat').textContent=`${fi+1} / ${p.length}`}
$('fc').onclick=()=>{fBack=!fBack;renderFlash();if(fBack)say(pool()[fi].w)};
$('fPrev').onclick=()=>{fi--;fBack=false;renderFlash()};$('fNext').onclick=()=>{fi++;fBack=false;renderFlash()};$('fListen').onclick=()=>say(pool()[fi].w);
// List
function renderList(){const q=$('lQ').value.toLowerCase();$('lT').innerHTML=pool().filter(d=>!q||(d.w+d.zh+d.s).toLowerCase().includes(q)).map((d,i)=>`<tr><td><b>${d.w}</b><br><span class="ipa">${d.ipa}</span></td><td>${d.zh}</td><td><button class="b g" data-i="${D.indexOf(d)}">🔊</button></td></tr>`).join('')}
$('lQ').oninput=renderList;$('lT').onclick=e=>{if(e.target.dataset.i)say(D[e.target.dataset.i].w)};
function renderStats(){const w=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]).slice(0,30);$('sBox').innerHTML=`<p>Typing: ${S.type[0]} / ${S.type[1]}<br>Quiz: ${S.quiz[0]} / ${S.quiz[1]}</p><p><b>Words to review 需复习:</b></p>`+(w.length?w.map(([k,n])=>{const d=D.find(x=>x.w==k)||{zh:''};return `<div>${k} — ${d.zh} (×${n})</div>`}).join(''):'<div>None yet 暂无</div>')}
$('sReset').onclick=()=>{if(confirm('Reset all scores?')){S={type:[0,0],quiz:[0,0],wrong:{}};save();renderStats()}};
$('secSel').onchange=()=>{fi=0;nextType();nextQuiz();renderList();renderFlash()};
nextType();nextQuiz();show('type');
</script></body></html>
