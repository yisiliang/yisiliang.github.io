<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">审核恢复会重新进入节点</title><desc id="desc">第一次review执行到interrupt暂停，回答到达后从review开头重入，interrupt返回回答，再提交。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#527090"/></marker></defs><rect width="960" height="360" rx="14" fill="#f6f8fc"/><text x="28" y="38" font-size="23" font-weight="600" fill="#20354f" font-family="sans-serif">审核恢复会重新进入节点</text><path d="M215,139 H265" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><path d="M455,139 H505" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><path d="M695,139 H745" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="100" width="190" height="78" rx="10" fill="#e7efff" stroke="#b7c8dd"/><text x="120.0" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">review首次进入</text><text x="120.0" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">interrupt抛出中断</text><rect x="265" y="100" width="190" height="78" rx="10" fill="#fff0d9" stroke="#b7c8dd"/><text x="360.0" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">持久化待审状态</text><text x="360.0" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">当前执行请求结束</text><rect x="505" y="100" width="190" height="78" rx="10" fill="#dff4ee" stroke="#b7c8dd"/><text x="600.0" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">审核请求到达</text><text x="600.0" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">同thread + resume</text><rect x="745" y="100" width="190" height="78" rx="10" fill="#e7efff" stroke="#b7c8dd"/><text x="840.0" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">review重新进入</text><text x="840.0" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">interrupt返回回答</text><text x="28" y="312" fill="#526780" font-family="sans-serif" font-size="14">业务写入安排在审核通过后的独立节点；中断前的代码可能再次执行。</text></svg>