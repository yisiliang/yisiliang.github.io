<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">同一轮读取快照，轮末合并更新</title><desc id="desc">A和B并行读取S0，Reducer合并两份增量得到S1，再触发后继节点。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#527090"/></marker></defs><rect width="960" height="360" rx="14" fill="#f6f8fc"/><text x="28" y="38" font-size="23" font-weight="600" fill="#20354f" font-family="sans-serif">同一轮读取快照，轮末合并更新</text><path d="M170,159 H200 V104 H230" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><path d="M200,159 V224 H230" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><path d="M400,104 H435 V159 H470" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><path d="M400,224 H435 V159" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><path d="M660,159 H735" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="120" width="145" height="78" rx="10" fill="#e7efff" stroke="#b7c8dd"/><text x="97.5" y="150" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">S0</text><text x="97.5" y="177" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">本轮输入快照</text><rect x="230" y="65" width="170" height="78" rx="10" fill="#dff4ee" stroke="#b7c8dd"/><text x="315.0" y="95" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">节点A</text><text x="315.0" y="122" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">返回增量ΔA</text><rect x="230" y="185" width="170" height="78" rx="10" fill="#dff4ee" stroke="#b7c8dd"/><text x="315.0" y="215" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">节点B</text><text x="315.0" y="242" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">返回增量ΔB</text><rect x="470" y="120" width="190" height="78" rx="10" fill="#fff0d9" stroke="#b7c8dd"/><text x="565.0" y="150" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">Channel.update</text><text x="565.0" y="177" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">合并本轮写入</text><rect x="735" y="120" width="195" height="78" rx="10" fill="#e7efff" stroke="#b7c8dd"/><text x="832.5" y="150" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">S1 → 下一轮</text><text x="832.5" y="177" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">后继读取新状态</text><text x="28" y="312" fill="#526780" font-family="sans-serif" font-size="14">节点B不能依赖本轮A尚未合并的更新；存在数据依赖就显式安排下一轮。</text></svg>