<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">业务已提交，检查点可能尚未保存</title><desc id="desc">外部提交成功与checkpoint保存之间存在崩溃窗口；重试需要业务幂等键。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#527090"/></marker></defs><rect width="960" height="360" rx="14" fill="#f6f8fc"/><text x="28" y="38" font-size="23" font-weight="600" fill="#20354f" font-family="sans-serif">业务已提交，检查点可能尚未保存</text><path d="M215,139 H265" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><path d="M455,139 H505" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="85" fill="#526780" font-size="13" font-family="sans-serif">危险窗口</text><path d="M695,139 H745" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="100" width="190" height="78" rx="10" fill="#e7efff" stroke="#b7c8dd"/><text x="120.0" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">节点发出请求</text><text x="120.0" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">稳定业务幂等键</text><rect x="265" y="100" width="190" height="78" rx="10" fill="#dff4ee" stroke="#b7c8dd"/><text x="360.0" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">业务事务提交</text><text x="360.0" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">结果已生效</text><rect x="505" y="100" width="190" height="78" rx="10" fill="#ffe5df" stroke="#b7c8dd"/><text x="600.0" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">响应或进程丢失</text><text x="600.0" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">执行方无法确认</text><rect x="745" y="100" width="190" height="78" rx="10" fill="#fff0d9" stroke="#b7c8dd"/><text x="840.0" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">同键重试 / 查询</text><text x="840.0" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">返回原始业务回执</text><text x="28" y="312" fill="#526780" font-family="sans-serif" font-size="14">Checkpoint保存图状态；业务唯一约束、幂等记录和结果查询处理外部提交窗口。</text></svg>