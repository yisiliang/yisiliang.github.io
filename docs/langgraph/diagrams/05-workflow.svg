<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">候选动作通过校验与审核后才允许写入</title><desc id="desc">抽取后规则校验，失败则拒绝，通过后等待人工审核，批准后才提交。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#527090"/></marker></defs><rect width="960" height="410" rx="14" fill="#f6f8fc"/><text x="28" y="38" font-size="23" font-weight="600" fill="#20354f" font-family="sans-serif">候选动作通过校验与审核后才允许写入</text><path d="M180,139 H225" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><path d="M380,139 H430" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><text x="385" y="125" fill="#526780" font-size="13" font-family="sans-serif">有效</text><path d="M585,139 H740" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><text x="635" y="125" fill="#526780" font-size="13" font-family="sans-serif">批准</text><path d="M302,178 V274 H430" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><text x="315" y="240" fill="#526780" font-size="13" font-family="sans-serif">无效</text><path d="M507,178 V235" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><text x="522" y="211" fill="#526780" font-size="13" font-family="sans-serif">拒绝</text><rect x="25" y="100" width="155" height="78" rx="10" fill="#e7efff" stroke="#b7c8dd"/><text x="102.5" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">extract</text><text x="102.5" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">合成规则提取</text><rect x="225" y="100" width="155" height="78" rx="10" fill="#e7efff" stroke="#b7c8dd"/><text x="302.5" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">validate</text><text x="302.5" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">确定性规则</text><rect x="430" y="100" width="155" height="78" rx="10" fill="#fff0d9" stroke="#b7c8dd"/><text x="507.5" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">review</text><text x="507.5" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">interrupt等待</text><rect x="740" y="100" width="190" height="78" rx="10" fill="#dff4ee" stroke="#b7c8dd"/><text x="835.0" y="130" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">submit</text><text x="835.0" y="157" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">DEMO回执</text><rect x="430" y="235" width="155" height="78" rx="10" fill="#ffe5df" stroke="#b7c8dd"/><text x="507.5" y="265" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">reject</text><text x="507.5" y="292" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">不执行业务写入</text><text x="28" y="362" fill="#526780" font-family="sans-serif" font-size="14">示例使用固定规则与模拟提交；真实系统须在写节点校验权限、幂等与业务版本。</text></svg>