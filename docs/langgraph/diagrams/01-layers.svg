<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">模型负责判断，图负责推进，业务服务负责提交</title><desc id="desc">业务应用分别调用模型、编排运行时与权威业务服务。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#527090"/></marker></defs><rect width="960" height="360" rx="14" fill="#f6f8fc"/><text x="28" y="38" font-size="23" font-weight="600" fill="#20354f" font-family="sans-serif">模型负责判断，图负责推进，业务服务负责提交</text><path d="M225,149 H280" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><path d="M460,149 H490 V104 H520" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><text x="473" y="85" fill="#526780" font-size="13" font-family="sans-serif">候选结果</text><path d="M460,149 H490 V219 H520" fill="none" stroke="#527090" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="253" fill="#526780" font-size="13" font-family="sans-serif">业务调用</text><rect x="25" y="110" width="200" height="78" rx="10" fill="#e7efff" stroke="#b7c8dd"/><text x="125.0" y="140" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">应用入口</text><text x="125.0" y="167" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">身份、输入、界面</text><rect x="280" y="110" width="180" height="78" rx="10" fill="#dff4ee" stroke="#b7c8dd"/><text x="370.0" y="140" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">LangGraph</text><text x="370.0" y="167" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">状态与控制流</text><rect x="520" y="65" width="195" height="78" rx="10" fill="#e7efff" stroke="#b7c8dd"/><text x="617.5" y="95" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">模型 / LangChain</text><text x="617.5" y="122" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">提取与工具协议</text><rect x="520" y="180" width="195" height="78" rx="10" fill="#fff0d9" stroke="#b7c8dd"/><text x="617.5" y="210" text-anchor="middle" fill="#20354f" font-family="sans-serif" font-size="17" font-weight="600">业务服务</text><text x="617.5" y="237" text-anchor="middle" fill="#526780" font-family="sans-serif" font-size="13">校验、幂等与事务</text><text x="28" y="312" fill="#526780" font-family="sans-serif" font-size="14">图决定何时执行；每个节点仍需遵守业务服务的权限和数据契约。</text></svg>