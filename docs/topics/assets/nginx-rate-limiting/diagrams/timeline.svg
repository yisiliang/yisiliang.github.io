<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="title desc"><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#253247;font-size:17px}.small{font-size:14px;fill:#52627a}.box{fill:#edf3ff;stroke:#507bc5;stroke-width:2}.arrow{stroke:#52627a;stroke-width:2;fill:none}</style><title id="title">三种延迟配置的理论放行时间</title><desc id="desc">全新Key同一毫秒到达7个请求，rate10，burst5：默认在0到500毫秒均匀放行6次；nodelay同时放行6次；delay2先放行3次，再每100毫秒放行一次。第7次都拒绝。</desc><rect width="820" height="350" rx="12" fill="#fafbfc"/><text x="24" y="32">新Key · rate=10r/s · burst=5 · 同一毫秒到达7次</text><text x="24" y="90">默认延迟</text><path class="arrow" d="M205 90H735"/><circle cx="210.0" cy="90" r="12" fill="#235bb6"/><text x="210.0" y="95" text-anchor="middle" style="fill:#fff;font-size:12px">1</text><circle cx="300.0" cy="90" r="12" fill="#235bb6"/><text x="300.0" y="95" text-anchor="middle" style="fill:#fff;font-size:12px">2</text><circle cx="390.0" cy="90" r="12" fill="#235bb6"/><text x="390.0" y="95" text-anchor="middle" style="fill:#fff;font-size:12px">3</text><circle cx="480.0" cy="90" r="12" fill="#235bb6"/><text x="480.0" y="95" text-anchor="middle" style="fill:#fff;font-size:12px">4</text><circle cx="570.0" cy="90" r="12" fill="#235bb6"/><text x="570.0" y="95" text-anchor="middle" style="fill:#fff;font-size:12px">5</text><circle cx="660.0" cy="90" r="12" fill="#235bb6"/><text x="660.0" y="95" text-anchor="middle" style="fill:#fff;font-size:12px">6</text><text x="748" y="95" class="small">7拒绝</text><text x="24" y="180">nodelay</text><path class="arrow" d="M205 180H735"/><circle cx="210.0" cy="180" r="20" fill="#235bb6"/><text x="210.0" y="185" text-anchor="middle" style="fill:#fff;font-size:12px">1–6</text><text x="748" y="185" class="small">7拒绝</text><text x="24" y="270">delay=2</text><path class="arrow" d="M205 270H735"/><circle cx="210.0" cy="270" r="20" fill="#235bb6"/><text x="210.0" y="275" text-anchor="middle" style="fill:#fff;font-size:12px">1–3</text><circle cx="300.0" cy="270" r="12" fill="#235bb6"/><text x="300.0" y="275" text-anchor="middle" style="fill:#fff;font-size:12px">4</text><circle cx="390.0" cy="270" r="12" fill="#235bb6"/><text x="390.0" y="275" text-anchor="middle" style="fill:#fff;font-size:12px">5</text><circle cx="480.0" cy="270" r="12" fill="#235bb6"/><text x="480.0" y="275" text-anchor="middle" style="fill:#fff;font-size:12px">6</text><text x="748" y="275" class="small">7拒绝</text><text x="210.0" y="322" class="small" text-anchor="middle">0ms</text><text x="300.0" y="322" class="small" text-anchor="middle">100ms</text><text x="390.0" y="322" class="small" text-anchor="middle">200ms</text><text x="480.0" y="322" class="small" text-anchor="middle">300ms</text><text x="570.0" y="322" class="small" text-anchor="middle">400ms</text><text x="660.0" y="322" class="small" text-anchor="middle">500ms</text></svg>