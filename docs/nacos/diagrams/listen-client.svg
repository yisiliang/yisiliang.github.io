<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" role="img" aria-labelledby="listen-client-title listen-client-desc"><title id="listen-client-title">变化通知：先标脏，再拉正文，再回调</title><desc id="listen-client-desc">提示ACK先于正文查询与业务监听执行，不提供业务生效确认。</desc><defs><marker id="listen-client-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#75ccb9"/></marker></defs><rect x="16" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="32" y="52" fill="#75ccb9" font-family="monospace" font-size="12">01</text><text x="121" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">变化键通知</text><path d="M230,78 H250" stroke="#75ccb9" stroke-width="2" marker-end="url(#listen-client-arrow)"/><rect x="253" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="269" y="52" fill="#75ccb9" font-family="monospace" font-size="12">02</text><text x="358" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">CacheData标脏·ACK</text><path d="M467,78 H487" stroke="#75ccb9" stroke-width="2" marker-end="url(#listen-client-arrow)"/><rect x="490" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="506" y="52" fill="#75ccb9" font-family="monospace" font-size="12">03</text><text x="595" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">对账并query正文</text><path d="M704,78 H724" stroke="#75ccb9" stroke-width="2" marker-end="url(#listen-client-arrow)"/><rect x="727" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="743" y="52" fill="#75ccb9" font-family="monospace" font-size="12">04</text><text x="832" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">MD5变化·Listener</text><text x="16" y="161" fill="#9bb6b5" font-family="sans-serif" font-size="14">提示ACK先于正文查询与业务监听执行，不提供业务生效确认。</text></svg>