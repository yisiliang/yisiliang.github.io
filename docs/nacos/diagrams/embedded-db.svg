<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" role="img" aria-labelledby="embedded-db-title embedded-db-desc"><title id="embedded-db-title">嵌入式数据库：复制SQL命令，不等于共享MySQL</title><desc id="embedded-db-desc">此图只描述嵌入式分布式路径；外部MySQL部署使用另一存储实现。</desc><defs><marker id="embedded-db-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#75ccb9"/></marker></defs><rect x="16" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="32" y="52" fill="#75ccb9" font-family="monospace" font-size="12">01</text><text x="121" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">ModifyRequest SQL列表</text><path d="M230,78 H250" stroke="#75ccb9" stroke-width="2" marker-end="url(#embedded-db-arrow)"/><rect x="253" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="269" y="52" fill="#75ccb9" font-family="monospace" font-size="12">02</text><text x="358" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">序列化WriteRequest</text><path d="M467,78 H487" stroke="#75ccb9" stroke-width="2" marker-end="url(#embedded-db-arrow)"/><rect x="490" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="506" y="52" fill="#75ccb9" font-family="monospace" font-size="12">03</text><text x="595" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">CP多数派提交</text><path d="M704,78 H724" stroke="#75ccb9" stroke-width="2" marker-end="url(#embedded-db-arrow)"/><rect x="727" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="743" y="52" fill="#75ccb9" font-family="monospace" font-size="12">04</text><text x="832" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">各副本DB应用</text><text x="16" y="161" fill="#9bb6b5" font-family="sans-serif" font-size="14">此图只描述嵌入式分布式路径；外部MySQL部署使用另一存储实现。</text></svg>