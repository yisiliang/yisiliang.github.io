<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" role="img" aria-labelledby="register-state-title register-state-desc"><title id="register-state-title">注册后的状态：实例表、revision、事件怎样推进</title><desc id="register-state-desc">主记录先更新，事件驱动索引与后续推送；它们并非一个分布式原子事务。</desc><defs><marker id="register-state-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#75ccb9"/></marker></defs><rect x="16" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="32" y="52" fill="#75ccb9" font-family="monospace" font-size="12">01</text><text x="121" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">Instance校验</text><path d="M230,78 H250" stroke="#75ccb9" stroke-width="2" marker-end="url(#register-state-arrow)"/><rect x="253" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="269" y="52" fill="#75ccb9" font-family="monospace" font-size="12">02</text><text x="358" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">Client实例关系更新</text><path d="M467,78 H487" stroke="#75ccb9" stroke-width="2" marker-end="url(#register-state-arrow)"/><rect x="490" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="506" y="52" fill="#75ccb9" font-family="monospace" font-size="12">03</text><text x="595" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">revision重算</text><path d="M704,78 H724" stroke="#75ccb9" stroke-width="2" marker-end="url(#register-state-arrow)"/><rect x="727" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="743" y="52" fill="#75ccb9" font-family="monospace" font-size="12">04</text><text x="832" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">注册/元数据事件</text><text x="16" y="161" fill="#9bb6b5" font-family="sans-serif" font-size="14">主记录先更新，事件驱动索引与后续推送；它们并非一个分布式原子事务。</text></svg>