<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" role="img" aria-labelledby="push-cache-title push-cache-desc"><title id="push-cache-title">推送ACK：收到列表，不等于业务已经使用</title><desc id="push-cache-desc">ACK边界位于SDK协议处理，不包含业务请求成功。</desc><defs><marker id="push-cache-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#75ccb9"/></marker></defs><rect x="16" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="32" y="52" fill="#75ccb9" font-family="monospace" font-size="12">01</text><text x="121" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">Server推送快照</text><path d="M230,78 H250" stroke="#75ccb9" stroke-width="2" marker-end="url(#push-cache-arrow)"/><rect x="253" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="269" y="52" fill="#75ccb9" font-family="monospace" font-size="12">02</text><text x="358" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">SDK更新ServiceInfo</text><path d="M467,78 H487" stroke="#75ccb9" stroke-width="2" marker-end="url(#push-cache-arrow)"/><rect x="490" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="506" y="52" fill="#75ccb9" font-family="monospace" font-size="12">03</text><text x="595" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">返回协议ACK</text><path d="M704,78 H724" stroke="#75ccb9" stroke-width="2" marker-end="url(#push-cache-arrow)"/><rect x="727" y="28" width="210" height="98" rx="12" fill="#132b31" stroke="#427d79"/><text x="743" y="52" fill="#75ccb9" font-family="monospace" font-size="12">04</text><text x="832" y="87" text-anchor="middle" fill="#e0eeec" font-family="sans-serif" font-size="15">业务监听刷新</text><text x="16" y="161" fill="#9bb6b5" font-family="sans-serif" font-size="14">ACK边界位于SDK协议处理，不包含业务请求成功。</text></svg>