<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc"><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#253247;font-size:17px}.small{font-size:14px;fill:#52627a}.box{fill:#edf3ff;stroke:#507bc5;stroke-width:2}.arrow{stroke:#52627a;stroke-width:2;fill:none}</style><title id="title">limit_req的单zone请求处理路径</title><desc id="desc">PREACCESS查找共享状态，超出burst拒绝，符合容量后记账，根据delay立即继续或注册定时器，到期恢复阶段。</desc><rect width="820" height="450" rx="12" fill="#fafbfc"/><rect class="box" x="230" y="20" width="360" height="52" rx="8"/><text x="410.0" y="53" text-anchor="middle">PREACCESS：读取Key与共享状态</text><rect class="box" x="230" y="105" width="360" height="52" rx="8"/><text x="410.0" y="138" text-anchor="middle">计算候选excess，检查burst</text><rect class="box" x="230" y="190" width="360" height="52" rx="8"/><text x="410.0" y="223" text-anchor="middle">提交状态，计算等待时间</text><rect class="box" x="20" y="285" width="345" height="52" rx="8"/><text x="192.5" y="318" text-anchor="middle">等待为0：继续HTTP阶段</text><rect class="box" x="450" y="285" width="345" height="52" rx="8"/><text x="622.5" y="318" text-anchor="middle">等待大于0：定时器挂起请求</text><rect class="box" x="450" y="380" width="345" height="52" rx="8"/><text x="622.5" y="413" text-anchor="middle">定时器到期：恢复HTTP阶段</text><path class="arrow" d="M410 72V105"/><path class="arrow" d="M410 157V190"/><path class="arrow" d="M330 242L193 285"/><path class="arrow" d="M490 242L622 285"/><path class="arrow" d="M622 337V380"/><path class="arrow" d="M590 131H710V210"/><text x="674" y="118" class="small">超过burst</text><rect x="630" y="210" width="160" height="48" rx="8" fill="#fff0ef" stroke="#c65349"/><text x="710" y="240" text-anchor="middle">拒绝</text><text x="32" y="400" class="small">等待占用请求与连接资源；Worker继续处理其他事件。</text></svg>