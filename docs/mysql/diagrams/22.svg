<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 154" role="img" aria-labelledby="mysql-title-22"><title id="mysql-title-22">图22：Binlog与redo两阶段提交：对齐两个事实</title><defs><marker id="mysql-arrow-22" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6e819a"/></marker></defs><text x="25" y="24" font-size="12" fill="#657892">图22 · Binlog与redo两阶段提交：对齐两个事实</text><rect x="25" y="42" width="210" height="72" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="130" y="82" text-anchor="middle" font-size="15" fill="#24364c">InnoDB prepare</text><rect x="275" y="42" width="210" height="72" rx="12" fill="#e7e7ff" stroke="#a5b6ce"/><text x="380" y="82" text-anchor="middle" font-size="15" fill="#24364c">binlog事务组flush</text><rect x="525" y="42" width="210" height="72" rx="12" fill="#dcf5ee" stroke="#a5b6ce"/><text x="630" y="82" text-anchor="middle" font-size="15" fill="#24364c">binlog sync</text><rect x="775" y="42" width="210" height="72" rx="12" fill="#fff0d8" stroke="#a5b6ce"/><text x="880" y="82" text-anchor="middle" font-size="15" fill="#24364c">引擎commit</text><path d="M235 78 L267 78" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-22)"/><path d="M485 78 L517 78" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-22)"/><path d="M735 78 L767 78" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-22)"/><text x="25" y="145" font-size="11" fill="#657892">前提：参与binlog协调且无错误的正常路径；sync是否执行受策略控制，跳过2PC与错误分支另见正文。</text></svg>