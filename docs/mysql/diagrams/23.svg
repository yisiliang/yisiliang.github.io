<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="mysql-title-23"><title id="mysql-title-23">图23：组提交：有序提交与线程自行提交分支</title><defs><marker id="mysql-arrow-23" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6e819a"/></marker></defs><text x="24" y="28" font-size="16" fill="#24364c">图23 · 组提交：有序提交与线程自行提交分支</text><rect x="25" y="65" width="215" height="64" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="132.5" y="92.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="132.5" dy="0">FLUSH队列leader</tspan><tspan x="132.5" dy="23">事务缓存→binlog文件</tspan></text><rect x="285" y="65" width="215" height="64" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="392.5" y="92.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="392.5" dy="0">SYNC队列leader</tspan><tspan x="392.5" dy="23">按sync_binlog策略同步</tspan></text><path d="M240 97 L275 97" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-23)"/><rect x="555" y="65" width="405" height="64" rx="12" fill="#e7e7ff" stroke="#a5b6ce"/><text x="757.5" y="92.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="757.5" dy="0">binlog_order_commits / Clone需要顺序？</tspan><tspan x="757.5" dy="23">且错误策略允许进入commit</tspan></text><path d="M500 97 L545 97" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-23)"/><rect x="555" y="200" width="190" height="85" rx="12" fill="#dcf5ee" stroke="#a5b6ce"/><text x="650.0" y="227.5" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="650.0" dy="0">是：COMMIT队列</tspan><tspan x="650.0" dy="23">leader提交事务组</tspan><tspan x="650.0" dy="23">并更新GTID</tspan></text><rect x="790" y="200" width="180" height="85" rx="12" fill="#fff0d8" stroke="#a5b6ce"/><text x="880.0" y="227.5" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="880.0" dy="0">否：跳过有序阶段</tspan><tspan x="880.0" dy="23">线程finish_commit</tspan><tspan x="880.0" dy="23">自行引擎提交</tspan></text><path d="M650 129 L650 190" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-23)"/><text x="662" y="165" font-size="13" fill="#45627f">是</text><path d="M865 129 L865 190" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-23)"/><text x="880" y="165" font-size="13" fill="#45627f">否</text><rect x="330" y="333" width="390" height="50" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="525.0" y="363.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="525.0" dy="0">完成相应提交/钩子，释放等待线程</tspan></text><path d="M650 285 L650 323" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-23)"/><path d="M880 285 L880 357 L730 357" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-23)"/><text x="24" y="403" font-size="12" fill="#657892">简化正常路径；after-commit钩子、flush/sync错误及ABORT_SERVER分支需结合ordered_commit全文。</text></svg>