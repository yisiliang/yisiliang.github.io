<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="mysql-title-19"><title id="mysql-title-19">图19：记录锁请求：快速成功或转慢路径</title><defs><marker id="mysql-arrow-19" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6e819a"/></marker></defs><text x="24" y="28" font-size="16" fill="#24364c">图19 · 记录锁请求：快速成功或转慢路径</text><rect x="30" y="70" width="210" height="70" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="135.0" y="100.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="135.0" dy="0">索引定位 + lock mode</tspan><tspan x="135.0" dy="23">record / gap / next-key</tspan></text><rect x="295" y="70" width="260" height="70" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="425.0" y="100.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="425.0" dy="0">lock_rec_lock_fast</tspan><tspan x="425.0" dy="23">简化请求尝试</tspan></text><path d="M240 105 L285 105" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-19)"/><rect x="680" y="45" width="275" height="60" rx="12" fill="#dcf5ee" stroke="#a5b6ce"/><text x="817.5" y="70.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="817.5" dy="0">SUCCESS / SUCCESS_CREATED</tspan><tspan x="817.5" dy="23">授予锁并返回</tspan></text><path d="M555 90 L670 75" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-19)"/><text x="586" y="65" font-size="13" fill="#45627f">成功</text><rect x="295" y="205" width="260" height="70" rx="12" fill="#e7e7ff" stroke="#a5b6ce"/><text x="425.0" y="235.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="425.0" dy="0">LOCK_REC_FAIL</tspan><tspan x="425.0" dy="23">进入lock_rec_lock_slow</tspan></text><path d="M425 140 L425 195" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-19)"/><text x="446" y="177" font-size="13" fill="#45627f">快路径无法处理</text><rect x="680" y="155" width="275" height="64" rx="12" fill="#dcf5ee" stroke="#a5b6ce"/><text x="817.5" y="192.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="817.5" dy="0">可授予 → 返回成功</tspan></text><rect x="680" y="245" width="275" height="64" rx="12" fill="#fff0d8" stroke="#a5b6ce"/><text x="817.5" y="272.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="817.5" dy="0">冲突 → 等待 / NOWAIT错误</tspan><tspan x="817.5" dy="23">或SKIP LOCKED跳过</tspan></text><path d="M555 227 L605 227 L605 187 L670 187" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-19)"/><text x="614" y="174" font-size="13" fill="#45627f">条件允许</text><path d="M555 253 L605 253 L605 277 L670 277" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-19)"/><text x="587" y="330" font-size="13" fill="#45627f">冲突及select_mode</text><text x="24" y="350" font-size="12" fill="#657892">fast失败不等于锁冲突；slow路径还需检查锁队列与读取模式。本图省略队列内部细节。</text></svg>