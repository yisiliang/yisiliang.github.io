<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="mysql-title-17"><title id="mysql-title-17">图17：ReadView可见性：匹配即早返回</title><defs><marker id="mysql-arrow-17" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6e819a"/></marker></defs><text x="24" y="28" font-size="16" fill="#24364c">图17 · ReadView可见性：匹配即早返回</text><rect x="65" y="65" width="380" height="72" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="255.0" y="96.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="255.0" dy="0">id &lt; m_up_limit_id</tspan><tspan x="255.0" dy="23">或 id == m_creator_trx_id</tspan></text><rect x="595" y="75" width="225" height="52" rx="12" fill="#dcf5ee" stroke="#a5b6ce"/><text x="707.5" y="106.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="707.5" dy="0">return true · 可见</tspan></text><path d="M445 101 L585 101" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-17)"/><text x="500" y="88" font-size="13" fill="#45627f">是</text><path d="M255 137 L255 195" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-17)"/><text x="272" y="171" font-size="13" fill="#45627f">否</text><rect x="65" y="205" width="380" height="64" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="255.0" y="242.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="255.0" dy="0">id &gt;= m_low_limit_id</tspan></text><rect x="595" y="211" width="225" height="52" rx="12" fill="#ffe3e1" stroke="#a5b6ce"/><text x="707.5" y="242.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="707.5" dy="0">return false · 不可见</tspan></text><path d="M445 237 L585 237" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-17)"/><text x="500" y="224" font-size="13" fill="#45627f">是</text><path d="M255 269 L255 327" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-17)"/><text x="272" y="305" font-size="13" fill="#45627f">否</text><rect x="65" y="337" width="380" height="64" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="255.0" y="374.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="255.0" dy="0">m_ids.empty()</tspan></text><rect x="595" y="343" width="225" height="52" rx="12" fill="#dcf5ee" stroke="#a5b6ce"/><text x="707.5" y="374.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="707.5" dy="0">return true · 可见</tspan></text><path d="M445 369 L585 369" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-17)"/><text x="500" y="356" font-size="13" fill="#45627f">是</text><path d="M255 401 L255 450" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-17)"/><text x="272" y="430" font-size="13" fill="#45627f">否</text><rect x="65" y="460" width="380" height="64" rx="12" fill="#dfefff" stroke="#a5b6ce"/><text x="255.0" y="487.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="255.0" dy="0">binary_search(m_ids, id)</tspan><tspan x="255.0" dy="23">活动集合是否命中？</tspan></text><rect x="560" y="429" width="290" height="52" rx="12" fill="#ffe3e1" stroke="#a5b6ce"/><text x="705.0" y="460.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="705.0" dy="0">命中 → return false · 不可见</tspan></text><rect x="560" y="510" width="290" height="52" rx="12" fill="#dcf5ee" stroke="#a5b6ce"/><text x="705.0" y="541.0" text-anchor="middle" font-size="15" fill="#24364c"><tspan x="705.0" dy="0">未命中 → return true · 可见</tspan></text><path d="M445 486 L485 486 L485 455 L550 455" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-17)"/><text x="499" y="444" font-size="13" fill="#45627f">是</text><path d="M445 501 L485 501 L485 536 L550 536" fill="none" stroke="#6e819a" stroke-width="2" marker-end="url(#mysql-arrow-17)"/><text x="499" y="559" font-size="13" fill="#45627f">否</text><text x="24" y="590" font-size="12" fill="#657892">任一return结束判断；不可见的当前记录由行读取路径追undo，ReadView自身不扫描历史链。</text></svg>