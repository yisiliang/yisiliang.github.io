worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log notice;
# Optional in matching builds: worker_shutdown_timeout 10s;
events { worker_connections 1024; }
http {
    default_type application/octet-stream;
    sendfile on;
    log_format lab '$time_iso8601 status=$status request_uri="$request_uri" '
                   'uri="$uri" rt=$request_time ua="$upstream_addr" '
                   'uct="$upstream_connect_time" uht="$upstream_header_time" '
                   'urt="$upstream_response_time" cache="$upstream_cache_status" '
                   'limit="$limit_req_status"';
    access_log logs/access.log lab;
    client_body_temp_path temp/body;
    proxy_temp_path temp/proxy;
    proxy_cache_path cache levels=1:2 keys_zone=labcache:1m max_size=32m inactive=1m;
    limit_req_zone $binary_remote_addr zone=labip:1m rate=2r/s;
    upstream app {
        server 127.0.0.1:18081;
        keepalive 16;
    }
    upstream retry_app {
        server 127.0.0.1:18082 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:18081 backup;
    }
    server {
        listen 127.0.0.1:18080;
        server_name lab.local;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 1s;
        proxy_send_timeout 1s;
        location = /version { return 200 "nginx-lab-v1\n"; }
        location = /old { rewrite ^ /version last; }
        location /prefix/ { return 200 "prefix\n"; }
        location ~ \.txt$ { return 200 "regex\n"; }
        location /static/ { root html; }
        location /echo { proxy_pass http://app; }
        location /slow { proxy_buffering off; proxy_pass http://app; }
        location /blob { proxy_pass http://app; }
        location /retry/ {
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
            proxy_pass http://retry_app;
        }
        location /cache/ {
            proxy_cache labcache;
            proxy_cache_valid 200 2s;
            proxy_cache_lock on;
            add_header X-Lab-Cache $upstream_cache_status always;
            proxy_pass http://app;
        }
        location /limit/ {
            limit_req zone=labip burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://app;
        }
    }
}
