<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t13 d13"><title id="t13">13 · phase engine：模块如何组合</title><desc id="d13">r.phase_handler → checker invokes handler（程序计数器）；checker invokes handler → OK / next（handler结果）；checker invokes handler → DECLINED / +1（handler结果）；checker invokes handler → AGAIN / suspend（handler结果）；AGAIN / suspend → future event resumes（保存上下文）；future event resumes → r.phase_handler（继续）</desc><defs><marker id="arrow13" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7ebfbd"/></marker></defs><rect width="920" height="410" rx="20" fill="#101e2b"/><path d="M285 80 L330 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow13)" opacity=".72"/><text x="307.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">程序计数器</text><path d="M590 80 L635 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow13)" opacity=".72"/><text x="612.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">handler结果</text><path d="M460 132 C460 199.5 155 199.5 155 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow13)" opacity=".72"/><text x="307.5" y="192.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">handler结果</text><path d="M460 132 C460 163.5 460 163.5 460 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow13)" opacity=".72"/><text x="460.0" y="156.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">handler结果</text><path d="M590 283 L635 283" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow13)" opacity=".72"/><text x="612.5" y="271.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">保存上下文</text><path d="M765 231 C765 199.5 155 199.5 155 132" stroke="#7ebfbd" stroke-width="2" fill="none"