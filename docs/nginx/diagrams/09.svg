<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t9 d9"><title id="t9">09 · connection池：为什么连接数不等于请求数</title><desc id="d9">free connection list → pop / count--（取槽）；pop / count-- → read + write retained（清零后恢复）；read + write retained → instance toggled（隔离旧事件）；instance toggled → socket lifetime（服务）；socket lifetime → close / push back（释放）；close / push back → free connection list（复用）</desc><defs><marker id="arrow9" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7ebfbd"/></marker></defs><rect width="920" height="410" rx="20" fill="#101e2b"/><path d="M285 80 L330 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow9)" opacity=".72"/><text x="307.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">取槽</text><path d="M590 80 L635 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow9)" opacity=".72"/><text x="612.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">清零后恢复</text><path d="M765 132 C765 199.5 155 199.5 155 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow9)" opacity=".72"/><text x="460.0" y="192.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">隔离旧事件</text><path d="M285 283 L330 283" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow9)" opacity=".72"/><text x="307.5" y="271.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">服务</text><path d="M590 283 L635 283" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow9)" opacity=".72"/><text x="612.5" y="271.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">释放</text><path d="M765 231 C765 199.5 155 199.5 155 132" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow9)" opacity=".72"/><text x="460.0" y="192.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">复用</text><rect x="25" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 01</text><text x="155" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">free connection list</text><rect x="330" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="348" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 02</text><text x="460" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">pop</text><text x="460" y="96" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">count--</text><rect x="635" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="653" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 03</text><text x="765" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">read + write retained</text><rect x="25" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 04</text><text x="155" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">instance toggled</text><rect x="330" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="348" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 05</text><text x="460" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">socket lifetime</text><rect x="635" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="653" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 06</text><text x="765" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">close</text><text x="765" y="299" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">push back</text></svg>