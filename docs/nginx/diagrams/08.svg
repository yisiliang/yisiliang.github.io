<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t8 d8"><title id="t8">08 · accept、惊群与接入公平性</title><desc id="d8">listen readiness → accept4 / accept（接入）；accept4 / accept → EAGAIN / return（队列空）；accept4 / accept → EMFILE / disable（fd不足）；accept4 / accept → get_connection（socket成功）；get_connection → protocol handler（分配成功）</desc><defs><marker id="arrow8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7ebfbd"/></marker></defs><rect width="920" height="410" rx="20" fill="#101e2b"/><path d="M285 80 L330 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow8)" opacity=".72"/><text x="307.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">接入</text><path d="M590 80 L635 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow8)" opacity=".72"/><text x="612.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">队列空</text><path d="M460 132 C460 199.5 155 199.5 155 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow8)" opacity=".72"/><text x="307.5" y="192.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">fd不足</text><path d="M460 132 C460 163.5 460 163.5 460 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow8)" opacity=".72"/><text x="460.0" y="156.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">socket成功</text><path d="M590 283 L635 283" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow8)" opacity=".72"/><text x="612.5" y="271.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">分配成功</text><rect x="25" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 01</text><text x="155" y="77" fill="#e9f