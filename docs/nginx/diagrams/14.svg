<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t14 d14"><title id="t14">14 · rewrite与内部跳转：重入有预算</title><desc id="d14">script engine → URI changed?（执行rewrite）；URI changed? → continue phases（否）；URI changed? → uri_changes--（是）；uri_changes-- → budget zero / 500（预算耗尽）；uri_changes-- → find config again（仍有预算）；find config again → script engine（新location）</desc><defs><marker id="arrow14" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7ebfbd"/></marker></defs><rect width="920" height="410" rx="20" fill="#101e2b"/><path d="M285 80 L330 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow14)" opacity=".72"/><text x="307.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">执行rewrite</text><path d="M590 80 L635 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow14)" opacity=".72"/><text x="612.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">否</text><path d="M460 132 C460 199.5 155 199.5 155 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow14)" opacity=".72"/><text x="307.5" y="192.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">是</text><path d="M285 283 L330 283" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow14)" opacity=".72"/><text x="307.5" y="271.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">预算耗尽</text><path d="M285 283 L635 283" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow14)" opacity=".72"/><text x="460.0" y="271.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">仍有预算</text><path d="M765 231 C765 199.5 155 199.5 155 132" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow14)" opacity=".72"/><text x="460.0" y="192.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">新location</text><rect x="25" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 01</text><text x="155" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">script engine</text><rect x="330" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="348" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 02</text><text x="460" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">URI changed?</text><rect x="635" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="653" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 03</text><text x="765" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">continue phases</text><rect x="25" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 04</text><text x="155" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">uri_changes--</text><rect x="330" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="348" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 05</text><text x="460" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">budget zero</text><text x="460" y="299" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">500</text><rect x="635" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="653" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 06</text><text x="765" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">find config again</text></svg>