<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t24 d24"><title id="t24">24 · TLS、终结与性能诊断</title><desc id="d24">SSL handshake → WANT_READ / WRITE（尚未完成）；WANT_READ / WRITE → event callback resumes（NGX_AGAIN）；event callback resumes → SSL handshake（再握手）；SSL handshake → HTTP lifecycle（handshaked）；HTTP lifecycle → references / keepalive（finalize）；HTTP lifecycle → logs + segment timings（观测）</desc><defs><marker id="arrow24" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7ebfbd"/></marker></defs><rect width="920" height="410" rx="20" fill="#101e2b"/><path d="M285 80 L330 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow24)" opacity=".72"/><text x="307.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">尚未完成</text><path d="M590 80 L635 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow24)" opacity=".72"/><text x="612.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">NGX_AGAIN</text><path d="M635 80 L285 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow24)" opacity=".72"/><text x="460.0" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">再握手</text><path d="M155 132 C155 163.5 155 163.5 155 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow24)" opacity=".72"/><text x="155.0" y="156.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">handshaked</text><path d="M285 283 L330 283" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow24)" opacity=".72"/><text x="307.5" y="271.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">finalize</text><path d="M285 283 L635 283" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow24)" opacity=".72"/><text x="460.0" y="271.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">观测</text><rect x="25" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 01</text><text x="155" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">SSL handshake</text><rect x="330" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="348" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 02</text><text x="460" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">WANT_READ</text><text x="460" y="96" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">WRITE</text><rect x="635" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="653" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 03</text><text x="765" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">event callback resumes</text><rect x="25" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 04</text><text x="155" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">HTTP lifecycle</text><rect x="330" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="348" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 05</text><text x="460" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">references</text><text x="460" y="299" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">keepalive</text><rect x="635" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="653" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 06</text><text x="765" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">logs + segment timings</text></svg>