<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t19 d19"><title id="t19">19 · 上游keepalive与DNS边界</title><desc id="d19">balancer selects addr → worker idle cache（地址匹配）；worker idle cache → cached socket hit（有连接）；cached socket hit → NGX_DONE / reuse（删idle timer）；worker idle cache → new connect on miss（无连接）；DNS resolver boundary → balancer selects addr（影响新地址）</desc><defs><marker id="arrow19" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7ebfbd"/></marker></defs><rect width="920" height="410" rx="20" fill="#101e2b"/><path d="M285 80 L330 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow19)" opacity=".72"/><text x="307.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">地址匹配</text><path d="M590 80 L635 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow19)" opacity=".72"/><text x="612.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">有连接</text><path d="M765 132 C765 199.5 155 199.5 155 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow19)" opacity=".72"/><text x="460.0" y="192.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">删idle timer</text><path d="M460 132 C460 163.5 460 163.5 460 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow19)" opacity=".72"/><text x="460.0" y="156.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">无连接</text><path d="M765 231 C765 181.5 155 181.5 155 132" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow19)" opacity=".72"/><text x="460.0" y="174.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">影响新地址</text><rect x="25" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="50" fill="#75bdb9" font-size="12" 