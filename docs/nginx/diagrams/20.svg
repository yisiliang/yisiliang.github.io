<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t20 d20"><title id="t20">20 · proxy buffer与背压：两边速度不一致</title><desc id="d20">upstream read → free / in buffers（缓冲）；free / in buffers → busy output buffers（交下游）；free / in buffers → temp file spill（允许且必要）；temp file spill → downstream filters（读出）；busy output buffers → downstream filters（消费）；busy output buffers → read backpressure（满且未消费）</desc><defs><marker id="arrow20" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7ebfbd"/></marker></defs><rect width="920" height="410" rx="20" fill="#101e2b"/><path d="M285 80 L330 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow20)" opacity=".72"/><text x="307.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">缓冲</text><path d="M590 80 L635 80" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow20)" opacity=".72"/><text x="612.5" y="68.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">交下游</text><path d="M460 132 C460 199.5 155 199.5 155 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow20)" opacity=".72"/><text x="307.5" y="192.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">允许且必要</text><path d="M285 283 L330 283" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow20)" opacity=".72"/><text x="307.5" y="271.0" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">读出</text><path d="M765 132 C765 181.5 460 181.5 460 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow20)" opacity=".72"/><text x="612.5" y="174.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">消费</text><path d="M765 132 C765 199.5 765 199.5 765 231" stroke="#7ebfbd" stroke-width="2" fill="none" marker-end="url(#arrow20)" opacity=".72"/><text x="765.0" y="192.5" text-anchor="middle" fill="#c9e4e6" font-family="system-ui,sans-serif" font-size="13">满且未消费</text><rect x="25" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 01</text><text x="155" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">upstream read</text><rect x="330" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="348" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 02</text><text x="460" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">free</text><text x="460" y="96" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">in buffers</text><rect x="635" y="28" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="653" y="50" fill="#75bdb9" font-size="12" font-family="monospace">STATE 03</text><text x="765" y="77" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">busy output buffers</text><rect x="25" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="43" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 04</text><text x="155" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">temp file spill</text><rect x="330" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="348" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 05</text><text x="460" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">downstream filters</text><rect x="635" y="231" width="260" height="104" rx="14" fill="#193347" stroke="#39768a"/><text x="653" y="253" fill="#75bdb9" font-size="12" font-family="monospace">STATE 06</text><text x="765" y="280" fill="#e9f0f7" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">read backpressure</text></svg>